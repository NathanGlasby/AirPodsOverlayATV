name: Signed Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIRPODS_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      AIRPODS_KEYSTORE_PASSWORD: ${{ secrets.AIRPODS_KEYSTORE_PASSWORD }}
      AIRPODS_KEY_ALIAS: ${{ secrets.AIRPODS_KEY_ALIAS }}
      AIRPODS_KEY_PASSWORD: ${{ secrets.AIRPODS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            bash scripts/check-release-tag.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "The tagged commit is not part of origin/main." >&2
              exit 1
            fi
          else
            bash scripts/check-release-tag.sh --metadata >> "$GITHUB_OUTPUT"
          fi
      - name: Check the release tag script
        run: bash scripts/check-release-tag-test.sh
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AIRPODS_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > release.jks
      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon --max-workers=2 :app:verifyReleaseSigning testDebugUnitTest lintRelease assembleRelease
      - name: Package and verify the final APK
        id: package
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected one release APK, found ${#apks[@]}." >&2
            printf '  %s\n' "${apks[@]}" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_label="$GITHUB_REF_NAME"
            release_ref="$GITHUB_REF_NAME"
          else
            release_label="manual-v${{ steps.version.outputs.version_name }}-${GITHUB_SHA::7}"
            release_ref="manual"
          fi

          final_apk="AirPodsOverlay-${release_label}.apk"
          cp -- "${apks[0]}" "$final_apk"

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [[ -z "$apksigner" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$final_apk"

          apk_sha256=$(sha256sum "$final_apk" | awk '{print $1}')
          printf '%s  %s\n' "$apk_sha256" "$final_apk" > release-checksums.txt
          {
            printf 'release_ref=%s\n' "$release_ref"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'version_name=%s\n' "${{ steps.version.outputs.version_name }}"
            printf 'version_code=%s\n' "${{ steps.version.outputs.version_code }}"
            printf 'apk_file=%s\n' "$final_apk"
            printf 'apk_sha256=%s\n' "$apk_sha256"
          } > release-metadata.txt
          printf 'apk=%s\n' "$final_apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: |
            AirPodsOverlay-*.apk
            release-checksums.txt
            release-metadata.txt
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" AirPodsOverlay-*.apk release-checksums.txt release-metadata.txt --clobber
