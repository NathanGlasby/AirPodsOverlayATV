name: Signed Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AIRPODS_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      AIRPODS_KEYSTORE_PASSWORD: ${{ secrets.AIRPODS_KEYSTORE_PASSWORD }}
      AIRPODS_KEY_ALIAS: ${{ secrets.AIRPODS_KEY_ALIAS }}
      AIRPODS_KEY_PASSWORD: ${{ secrets.AIRPODS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AIRPODS_KEYSTORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > release.jks
      - name: Test, lint, and build signed APK
        run: ./gradlew --no-daemon --max-workers=2 :app:verifyReleaseSigning testDebugUnitTest lintRelease assembleRelease
      - name: Verify signature and checksum
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee release-checksums.txt
          cp "$APK" "AirPodsOverlay-${GITHUB_REF_NAME:-manual}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            AirPodsOverlay-*.apk
            release-checksums.txt
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" AirPodsOverlay-*.apk release-checksums.txt --clobber
